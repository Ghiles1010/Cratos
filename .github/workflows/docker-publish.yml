name: Build & Publish Docker Images

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "backend=${USERNAME}/cratos:${VERSION},${USERNAME}/cratos:latest" >> $GITHUB_OUTPUT
            echo "ui=${USERNAME}/cratos-ui:${VERSION},${USERNAME}/cratos-ui:latest" >> $GITHUB_OUTPUT
          else
            echo "backend=${USERNAME}/cratos:dev" >> $GITHUB_OUTPUT
            echo "ui=${USERNAME}/cratos-ui:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ steps.tags.outputs.ui }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
