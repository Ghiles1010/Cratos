# Cratos – Docker Compose

x-backend-env: &backend-env
  environment:
    - DB_NAME=${DB_NAME:-cratos}
    - DB_USER=${DB_USER:-cratos}
    - DB_PASSWORD=${DB_PASSWORD:-cratos_password}
    - DB_HOST=${DB_HOST:-cratos-postgres}
    - DB_PORT=${DB_PORT:-5432}
    - CELERY_BROKER_URL=${REDIS_URL:-redis://cratos-redis:6379/0}
    - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://cratos-redis:6379/0}
    - CRATOS_ADMIN_USERNAME=${CRATOS_ADMIN_USERNAME:-admin}
    - CRATOS_ADMIN_PASSWORD=${CRATOS_ADMIN_PASSWORD:-admin}

services:
  # ── PostgreSQL ──
  cratos-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cratos}
      POSTGRES_USER: ${DB_USER:-cratos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cratos_password}
    volumes:
      - cratos_pg_data:/var/lib/postgresql/data
    ports:
      - "${CRATOS_POSTGRES_PORT:-9433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cratos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  cratos-redis:
    image: redis:7-alpine
    ports:
      - "${CRATOS_REDIS_PORT:-9638}:6379"
    volumes:
      - cratos_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django API ──
  cratos-web:
    build: ./backend
    entrypoint: ["bash", "/app/entrypoint.sh"]
    command: uv run python manage.py runserver 0.0.0.0:8001
    <<: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "${CRATOS_API_PORT:-9101}:8001"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      cratos-postgres:
        condition: service_healthy
      cratos-redis:
        condition: service_healthy

  # ── Celery Worker ──
  cratos-worker:
    build: ./backend
    command: uv run celery -A config worker --loglevel=info
    <<: *backend-env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      cratos-web:
        condition: service_healthy

  # ── Dispatcher ──
  cratos-dispatcher:
    build: ./backend
    command: uv run python manage.py run_dispatcher_loop --interval=10
    <<: *backend-env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      cratos-web:
        condition: service_healthy

  # ── React UI ──
  cratos-ui:
    build:
      context: ./ui
      args:
        - VITE_SCHEDULER_API_URL=${CRATOS_API_URL:-http://localhost:9101}
    ports:
      - "${CRATOS_UI_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cratos-web

volumes:
  cratos_pg_data:
  cratos_redis_data:
