# Cratos – Production Docker Compose
# Usage: docker compose up -d

x-backend-env: &backend-env
  environment:
    - DB_NAME=${DB_NAME:-cratos}
    - DB_USER=${DB_USER:-cratos}
    - DB_PASSWORD=${DB_PASSWORD:-cratos_password}
    - DB_HOST=${DB_HOST:-postgres}
    - DB_PORT=${DB_PORT:-5432}
    - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
    - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379/0}
    - CRATOS_ADMIN_USERNAME=${CRATOS_ADMIN_USERNAME:-admin}
    - CRATOS_ADMIN_PASSWORD=${CRATOS_ADMIN_PASSWORD:-admin}

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cratos}
      POSTGRES_USER: ${DB_USER:-cratos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cratos_password}
    volumes:
      - cratos_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cratos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    volumes:
      - cratos_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django API ──
  web:
    image: ${DOCKERHUB_USERNAME:-ghiles01}/cratos:latest
    entrypoint: ["bash", "/app/entrypoint.sh"]
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 3
    <<: *backend-env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ──
  worker:
    image: ${DOCKERHUB_USERNAME:-ghiles01}/cratos:latest
    command: uv run celery -A config worker --loglevel=info
    <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # ── Dispatcher ──
  dispatcher:
    image: ${DOCKERHUB_USERNAME:-ghiles01}/cratos:latest
    command: uv run python manage.py run_dispatcher_loop --interval=10
    <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # ── React UI (proxies API via nginx) ──
  ui:
    image: ${DOCKERHUB_USERNAME:-ghiles01}/cratos-ui:latest
    ports:
      - "${CRATOS_UI_PORT:-3001}:3001"
    restart: unless-stopped
    depends_on:
      - web

volumes:
  cratos_pg_data:
  cratos_redis_data:
