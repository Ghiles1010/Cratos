# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  DB_USER: cratos

tasks:
  default:
    desc: Cratos – help
    cmds:
      - task --list

  # ── Docker ──

  build:
    desc: Build all Docker images
    cmds:
      - docker compose build

  up:
    desc: Start all services
    cmds:
      - echo "Starting Cratos..."
      - docker compose up -d
      - task: wait-for-services
      - echo "Cratos is ready – UI http://localhost:3001 | API http://localhost:9101"

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  restart:
    desc: Restart all services
    cmds:
      - docker compose restart

  clean:
    desc: Stop all services, remove containers, networks, and volumes
    cmds:
      - docker compose down -v --remove-orphans

  logs:
    desc: Tail logs from all services
    cmds:
      - docker compose logs -f

  wait-for-services:
    desc: Wait for PostgreSQL and Redis to be ready
    cmds:
      - |
        until docker compose exec -T postgres pg_isready -U {{.DB_USER}}; do sleep 2; done
      - |
        until docker compose exec -T redis redis-cli ping; do sleep 2; done
      - echo "Services are ready!"

  # ── Database ──

  migrate:
    desc: Run database migrations
    cmds:
      - docker compose exec web uv run python manage.py migrate

  makemigrations:
    desc: Generate migration files
    cmds:
      - docker compose exec web uv run python manage.py makemigrations

  # ── Django ──

  shell:
    desc: Open Django shell
    interactive: true
    cmds:
      - docker compose exec web uv run python manage.py shell

  manage:
    desc: "Run a Django management command (usage: task manage -- <cmd>)"
    cmds:
      - docker compose exec web uv run python manage.py {{.CLI_ARGS}}

  get-api-key:
    desc: "Print the API key for a user (usage: task get-api-key -- --username=admin --password=admin)"
    cmds:
      - docker compose exec web uv run python manage.py get_api_key {{.CLI_ARGS}}

  test:
    desc: Run Django tests (uses SQLite in-memory, no PostgreSQL needed)
    cmds:
      - docker compose exec web uv run python manage.py test --settings=config.settings_test

  # ── Frontend ──

  ui:install:
    desc: Install UI dependencies
    dir: ui
    cmds:
      - npm install

  ui:dev:
    desc: Start UI development server
    dir: ui
    cmds:
      - npm run dev

  # ── First-time setup ──

  init:
    desc: Full first-time setup – build and start (migrations + bootstrap run automatically)
    cmds:
      - task: build
      - task: up
      - echo "Cratos is fully initialized!"
