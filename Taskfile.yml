# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  DC: docker compose -f docker-compose.dev.yml

tasks:
  default:
    desc: Cratos – help
    cmds:
      - task --list

  # ── Docker ──

  build:
    desc: Build all Docker images
    cmds:
      - "{{.DC}} build"

  up:
    desc: Start all services
    cmds:
      - "{{.DC}} up -d"
      - echo "Cratos is ready – UI http://localhost:3001 | API http://localhost:9101"

  down:
    desc: Stop all services
    cmds:
      - "{{.DC}} down"

  restart:
    desc: "Restart all services (or a specific one: task restart -- web)"
    cmds:
      - "{{.DC}} restart {{.CLI_ARGS}}"

  clean:
    desc: Stop all services, remove containers, networks, and volumes
    cmds:
      - "{{.DC}} down -v --remove-orphans"

  logs:
    desc: Tail logs from all services
    cmds:
      - "{{.DC}} logs -f"

  # ── Database ──

  migrate:
    desc: Run database migrations
    cmds:
      - "{{.DC}} exec web uv run python manage.py migrate"

  makemigrations:
    desc: Generate migration files
    cmds:
      - "{{.DC}} exec web uv run python manage.py makemigrations"

  # ── Django ──

  shell:
    desc: Open Django shell
    interactive: true
    cmds:
      - "{{.DC}} exec web uv run python manage.py shell"

  manage:
    desc: "Run a Django management command (usage: task manage -- <cmd>)"
    cmds:
      - "{{.DC}} exec web uv run python manage.py {{.CLI_ARGS}}"

  get-api-key:
    desc: "Print the API key for a user"
    cmds:
      - "{{.DC}} exec web uv run python manage.py get_api_key --username={{.USERNAME}} --password={{.PASSWORD}}"
    requires:
      vars: [USERNAME, PASSWORD]

  test:
    desc: Run Django tests (uses SQLite in-memory, no PostgreSQL needed)
    cmds:
      - "{{.DC}} exec web uv run python manage.py test --settings=config.settings_test"

  # ── Frontend ──

  ui:rebuild:
    desc: Rebuild and restart the UI container (e.g. after package.json changes)
    cmds:
      - "{{.DC}} build --no-cache ui"
      - "{{.DC}} restart ui"
